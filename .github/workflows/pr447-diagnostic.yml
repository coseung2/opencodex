name: PR 447 focused diagnostic

on:
  push:
    branches:
      - diag/pr447-review-ci
    paths:
      - .github/workflows/pr447-diagnostic.yml

permissions:
  contents: write

jobs:
  diagnose:
    if: ${{ !contains(github.event.head_commit.message, '[diagnostic-output]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: bun install --frozen-lockfile
      - name: Run focused tests and capture output
        shell: bash
        run: |
          set +e
          bun test --isolate tests/kiro-review-regressions.test.ts > pr447-diagnostic.log 2>&1
          status=$?
          printf '%s\n' "$status" > pr447-diagnostic.status
          cat pr447-diagnostic.log
          exit 0
      - name: Publish diagnostic output
        shell: bash
        run: |
          rm .github/workflows/pr447-diagnostic.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "[diagnostic-output] capture PR 447 focused test log"
          git push origin HEAD:diag/pr447-review-ci

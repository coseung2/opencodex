name: Fetch PR 447 upstream failure log

on:
  push:
    branches:
      - diag/pr447-review-ci
    paths:
      - .github/workflows/pr447-fetch-upstream-log.yml

permissions:
  contents: write

jobs:
  fetch-log:
    if: ${{ !contains(github.event.head_commit.message, '[upstream-log]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Fetch failed upstream job log
        shell: bash
        run: |
          set +e
          curl --fail --location --silent --show-error \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            'https://api.github.com/repos/lidge-jun/opencodex/actions/jobs/90045285980/logs' \
            --output pr447-upstream-ubuntu.log
          status=$?
          printf '%s\n' "$status" > pr447-upstream-log.status
          if [ -f pr447-upstream-ubuntu.log ]; then tail -n 250 pr447-upstream-ubuntu.log; fi
          exit 0
      - name: Publish fetched log
        shell: bash
        run: |
          rm .github/workflows/pr447-fetch-upstream-log.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "[upstream-log] capture PR 447 Ubuntu failure"
          git push origin HEAD:diag/pr447-review-ci

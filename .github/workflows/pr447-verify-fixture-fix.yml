name: Verify PR 447 fixture isolation fix

on:
  push:
    branches:
      - diag/pr447-review-ci
    paths:
      - .github/workflows/pr447-verify-fixture-fix.yml

permissions:
  contents: write

jobs:
  verify:
    if: ${{ !contains(github.event.head_commit.message, '[verified-patch]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
      - name: Patch fixture boundary
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('tests/kiro-adapter.test.ts')
          text = path.read_text()
          marker = '  test("an account with no stored Kiro metadata never borrows different local CLI metadata", async () => {'
          marker_at = text.index(marker)
          insertion = '    await saveCredential("kiro", {'
          insertion_at = text.index(insertion, marker_at)
          text = text[:insertion_at] + '    delete process.env.KIRO_REGION;\n' + text[insertion_at:]
          path.write_text(text)
          PY
      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.14
      - name: Install dependencies
        run: |
          bun install --frozen-lockfile
          cd gui
          bun install --frozen-lockfile
      - name: Verify
        shell: bash
        run: |
          set +e
          bun x tsc --noEmit > pr447-verified-patch.txt 2>&1
          typecheck=$?
          bun test --isolate tests >> pr447-verified-patch.txt 2>&1
          tests=$?
          printf 'typecheck=%s\ntests=%s\n' "$typecheck" "$tests" > pr447-verified-patch.status.txt
          tail -n 250 pr447-verified-patch.txt
          exit 0
      - name: Publish result
        shell: bash
        run: |
          rm .github/workflows/pr447-verify-fixture-fix.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "[verified-patch] isolate Kiro adapter fixture and capture result"
          git push origin HEAD:diag/pr447-review-ci

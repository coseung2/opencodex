name: Kiro rebase workspace

on:
  push:
    branches:
      - automation/kiro-rebase-driver

permissions:
  contents: write

jobs:
  rebase:
    runs-on: ubuntu-latest
    steps:
      - name: Check out resolved workspace
        uses: actions/checkout@v4
        with:
          ref: automation/kiro-merge-work
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build clean rebased branch on current dev
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/lidge-jun/opencodex.git 2>/dev/null || true
          git fetch upstream dev
          git diff --binary upstream/dev..HEAD > /tmp/kiro-multiauth.patch

          changed_count=$(git diff --name-only upstream/dev..HEAD | wc -l | tr -d ' ')
          test "$changed_count" = "20"
          ! git diff --name-only upstream/dev..HEAD | grep -q '^\.github/workflows/kiro-rebase-driver.yml$'

          git checkout -B automation/kiro-rebased upstream/dev
          git apply --index /tmp/kiro-multiauth.patch

          python3 - <<'PY'
          from pathlib import Path

          path = Path("tests/oauth-refresh.test.ts")
          text = path.read_text(encoding="utf-8")
          start_marker = '  test("account-scoped Kiro OIDC refresh sends stored client registration and preserves metadata", async () => {'
          next_marker = '  test("failed Kiro refresh does not overwrite the stored account from local CLI", async () => {'
          start = text.index(start_marker)
          end = text.index(next_marker, start)
          lines = [
              '  test("account-scoped Kiro OIDC refresh sends stored client registration and preserves metadata", async () => {',
              '    const profileArn = "arn:aws:codewhisperer:eu-west-1:123456789012:profile/account-scoped";',
              '    const urls: string[] = [];',
              '    const bodies: unknown[] = [];',
              '    globalThis.fetch = (async (input, init) => {',
              '      urls.push(String(input));',
              '      bodies.push(JSON.parse(String(init?.body)));',
              '      return new Response(JSON.stringify({',
              '        accessToken: "aoa-oidc-fresh",',
              '        refreshToken: "rt-oidc-fresh",',
              '        expiresIn: 3600,',
              '      }), { status: 200 });',
              '    }) as typeof fetch;',
              '    await saveCredential("kiro", {',
              '      access: "aoa-oidc-old",',
              '      refresh: "rt-oidc-old",',
              '      expires: Date.now() - 1,',
              '      accountId: profileArn,',
              '      kiro: {',
              '        profileArn,',
              '        apiRegion: "eu-west-1",',
              '        ssoRegion: "eu-west-1",',
              '        clientId: "stored-client",',
              '        clientSecret: "stored-secret",',
              '      },',
              '    });',
              '',
              '    await expect(getValidAccessToken("kiro")).resolves.toBe("aoa-oidc-fresh");',
              '    expect(urls).toEqual(["https://oidc.eu-west-1.amazonaws.com/token"]);',
              '    expect(bodies).toEqual([{',
              '      grantType: "refresh_token",',
              '      clientId: "stored-client",',
              '      clientSecret: "stored-secret",',
              '      refreshToken: "rt-oidc-old",',
              '    }]);',
              '    expect(getCredential("kiro")).toMatchObject({',
              '      access: "aoa-oidc-fresh",',
              '      refresh: "rt-oidc-fresh",',
              '      accountId: profileArn,',
              '      kiro: {',
              '        profileArn,',
              '        apiRegion: "eu-west-1",',
              '        ssoRegion: "eu-west-1",',
              '        clientId: "stored-client",',
              '        clientSecret: "stored-secret",',
              '      },',
              '    });',
              '  });',
              '',
              '',
          ]
          replacement = "\n".join(lines)
          path.write_text(text[:start] + replacement + text[end:], encoding="utf-8")
          PY

          git add tests/oauth-refresh.test.ts
          git diff --cached --check
          ! git grep -n -E '^(<<<<<<<|=======|>>>>>>>)' -- \
            src/oauth/index.ts \
            src/providers/registry.ts \
            docs-site/src/content/docs/guides/providers.md \
            docs-site/src/content/docs/ja/guides/providers.md \
            docs-site/src/content/docs/ko/guides/providers.md \
            docs-site/src/content/docs/ru/guides/providers.md \
            docs-site/src/content/docs/zh-cn/guides/providers.md
          git commit -m "fix(kiro): support browser-based multi-account login"

      - name: Run focused Kiro and OAuth regressions on rebased tip
        run: >-
          bun test
          tests/kiro-adapter.test.ts
          tests/kiro-oauth.test.ts
          tests/oauth-reauth-bind.test.ts
          tests/oauth-refresh.test.ts
          tests/oauth-store-multi.test.ts
          tests/server-kiro-oauth-401-replay.test.ts

      - name: Run typecheck and privacy scan on rebased tip
        run: |
          bun run typecheck
          bun run privacy:scan

      - name: Publish rebased branch
        run: git push --force origin HEAD:automation/kiro-rebased

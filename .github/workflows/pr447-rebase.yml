name: Materialize rebased PR 447 commit

on:
  push:
    branches:
      - diag/pr447-rebase
    paths:
      - .github/workflows/pr447-rebase.yml

permissions:
  contents: write

jobs:
  materialize:
    if: ${{ !contains(github.event.head_commit.message, '[rebase-object]') }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout orchestrator branch
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          fetch-depth: 0
      - name: Rebase and create Git data objects
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/lidge-jun/opencodex.git 2>/dev/null || \
            git remote set-url upstream https://github.com/lidge-jun/opencodex.git
          git fetch --no-tags upstream dev
          git fetch --no-tags origin fix/kiro-multiauth diag/pr447-rebase diag/pr447-upstream-dev
          git checkout -B fix/kiro-multiauth origin/fix/kiro-multiauth
          git rebase upstream/dev
          export BASE_SHA="$(git rev-parse upstream/dev)"
          export REBASED_HEAD="$(git rev-parse HEAD)"
          python3 - <<'PY'
          import base64
          import json
          import os
          import subprocess
          import urllib.request
          from pathlib import Path

          repo = "coseung2/opencodex"
          token = os.environ["GH_TOKEN"]
          base_sha = os.environ["BASE_SHA"]
          rebased_head = os.environ["REBASED_HEAD"]

          def run(*args: str) -> bytes:
              return subprocess.check_output(args)

          def api_post(path: str, payload: dict) -> dict:
              request = urllib.request.Request(
                  f"https://api.github.com/repos/{repo}{path}",
                  data=json.dumps(payload).encode(),
                  method="POST",
                  headers={
                      "Authorization": f"Bearer {token}",
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                      "User-Agent": "pr447-rebase-materializer",
                      "Content-Type": "application/json",
                  },
              )
              with urllib.request.urlopen(request) as response:
                  return json.load(response)

          changed = [
              item.decode()
              for item in run("git", "diff", "--name-only", "-z", base_sha, rebased_head).split(b"\0")
              if item
          ]
          entries = []
          for path in changed:
              exists = subprocess.run(
                  ["git", "cat-file", "-e", f"{rebased_head}:{path}"],
                  stdout=subprocess.DEVNULL,
                  stderr=subprocess.DEVNULL,
              ).returncode == 0
              if not exists:
                  entries.append({"path": path, "mode": "100644", "type": "blob", "sha": None})
                  continue
              ls_tree = run("git", "ls-tree", rebased_head, "--", path).decode().strip()
              mode = ls_tree.split(maxsplit=1)[0]
              content = run("git", "show", f"{rebased_head}:{path}")
              blob = api_post(
                  "/git/blobs",
                  {"content": base64.b64encode(content).decode(), "encoding": "base64"},
              )
              entries.append({"path": path, "mode": mode, "type": "blob", "sha": blob["sha"]})

          base_tree = run("git", "rev-parse", f"{base_sha}^{{tree}}").decode().strip()
          tree = api_post("/git/trees", {"base_tree": base_tree, "tree": entries})
          commit = api_post(
              "/git/commits",
              {
                  "message": "fix(kiro): support browser-based multi-account login\n\nRebased onto current upstream dev and includes all review fixes through d972876.",
                  "tree": tree["sha"],
                  "parents": [base_sha],
              },
          )
          Path("/tmp/pr447-rebase-object.txt").write_text(
              "\n".join(
                  [
                      f"base_sha={base_sha}",
                      f"rebased_local_head={rebased_head}",
                      f"tree_sha={tree['sha']}",
                      f"commit_sha={commit['sha']}",
                      f"changed_files={len(changed)}",
                      *changed,
                      "",
                  ]
              )
          )
          PY
          git checkout -B diag/pr447-rebase origin/diag/pr447-rebase
          cp /tmp/pr447-rebase-object.txt pr447-rebase-object.txt
          git add pr447-rebase-object.txt
          git commit -m "[rebase-object] capture PR 447 rebased commit"
          git push origin HEAD:diag/pr447-rebase
